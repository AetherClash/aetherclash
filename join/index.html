<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Join my AetherClash match</title>
<meta property="og:title" content="A friend challenges you in AetherClash!">
<meta property="og:description" content="Tap to join their turn-based match.">
<meta name="apple-itunes-app" content="app-id=6823393128">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1b1430;color:#f3e6c4;font-family:-apple-system,Helvetica,sans-serif;text-align:center}
.card{max-width:340px;padding:28px;border:3px solid #c9a24a;border-radius:18px;background:#2a2040}
h1{font-size:22px;margin:0 0 6px}.code{font-size:20px;letter-spacing:3px;color:#ffd27a;margin:8px 0 18px}
a.btn{display:block;margin:10px 0;padding:14px;border-radius:14px;color:#fff;font-weight:800;text-decoration:none}
.open{background:#2f9e66}.store{background:#3a63c9}
</style></head><body><div class="card">
<h1>A friend challenges you!</h1>
<div>Code</div><div class="code" id="code">------</div>
<a class="btn open" id="open" href="aetherclash://join">Open in AetherClash</a>
<a class="btn store" href="https://apps.apple.com/app/id6823393128">Get AetherClash on the App Store</a>
<p style="font-size:13px;opacity:.8">Install the app, then come back and tap "Open in AetherClash".</p>
</div>
<script>
var c=(new URLSearchParams(location.search).get('c')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
document.getElementById('code').textContent=c||'------';
var app='aetherclash://join?c='+c; document.getElementById('open').href=app;
if(c){ setTimeout(function(){ location.href=app; },150); }
</script></body></html>
